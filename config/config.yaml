# config/config.yaml
# Runtime configuration. Secrets come from .env, never here.

agent:
  client: http
  base_url_env: CGIO_API_BASE       # e.g. https://api.clinicalguidelines.io
  api_key_env: CGIO_API_KEY
  timeout_seconds: 120
  endpoint_path: /api/v1/vascular-consult
  # pre_retrieval_mode=true enables the two-round flow that exposes gate behavior.
  # Phase 1 returns phase:awaiting_confirmation (gate fired) or retrieval_payload directly.
  pre_retrieval_mode: true

judges:
  - name: claude-opus-4-7
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    temperature: 0
    max_tokens: 1500
  - name: gpt-4o
    provider: openai
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 1500

run:
  runs_per_judge: 3
  runs_per_agent: 1                 # agent at temp 0; 1 capture is enough (raise if you want variance)
  cache: true
  blind_answers: true              # strip model self-identification before judging

paths:
  benchmark: data/benchmark/benchmark_queries.jsonl
  corpus_index: data/corpus/recommendation_index.json
  answers: outputs/answers/answers.jsonl
  judgments: outputs/judgments/judgments.jsonl
  metrics_dir: outputs/metrics
  report_dir: outputs/report

report:
  ci_method: wilson
  preliminary_if_unverified: true
