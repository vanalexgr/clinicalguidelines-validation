# config/config.yaml
# Runtime configuration. Secrets come from .env, never here.

agent:
  client: http
  # api_type: openwebui_synthesis → SSE tool-call + direct Laravel retrieval + SSE synthesis
  # api_type: laravel             → direct HTTP to /api/v1/vascular-consult (raw retrieval only)
  api_type: openwebui_synthesis
  model: gpt-5-chat
  base_url_env: CGIO_API_BASE            # https://chat.clinicalguidelines.io  (OpenWebUI)
  api_key_env: CGIO_API_KEY
  laravel_base_url_env: CGIO_LARAVEL_BASE  # https://chat.clinicalguidelines.io  (Laravel)
  laravel_api_key_env: CGIO_LARAVEL_KEY
  timeout_seconds: 120
  endpoint_path: /api/v1/vascular-consult
  pre_retrieval_mode: true               # enable gate for benchmark runs (two-phase: auto-confirm)

judges:
  - name: claude-opus-4-7
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    temperature: 0
    max_tokens: 1800
  - name: o3
    provider: openai
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 3000

run:
  runs_per_judge: 3
  runs_per_agent: 1                 # agent at temp 0; 1 capture is enough (raise if you want variance)
  cache: true
  blind_answers: true              # strip model self-identification before judging

paths:
  benchmark: data/benchmark/benchmark_queries.v2.jsonl
  corpus_index: data/corpus/recommendation_index.json
  answers: outputs/answers/answers.jsonl
  judgments: outputs/judgments/judgments.jsonl
  metrics_dir: outputs/metrics
  report_dir: outputs/report

report:
  ci_method: wilson
  preliminary_if_unverified: true
