name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest "ruff==0.9.3"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      - name: Reproduce reported figures
        run: python -m scripts.reproduce_paper
